<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover, shrink-to-fit=no" />
    <title>Fluxero — Captured Energy. Green Hydrogen.</title>
    <meta name="description" content="Fluxero converts curtailed renewable energy into green hydrogen at the source with Small Modular Hydrogen Plants — deployable worldwide." />
    <meta name="keywords" content="green hydrogen, curtailed energy, wasted renewable energy, electrolyser, Small Modular Hydrogen Plant, SMHP, hydrogen production, clean energy, digital twin, renewable hydrogen, wind solar hydro" />
    <meta name="author" content="Fluxero" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#070608" />
    <link rel="canonical" href="https://fluxero.uk/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Fluxero" />
    <meta property="og:title" content="Fluxero — Green Hydrogen from Captured Energy" />
    <meta property="og:description" content="We capture wasted wind, solar and hydro energy and turn it into green hydrogen at the source — before the grid can reject it." />
    <meta property="og:image" content="https://fluxero.uk/logo.png" />
    <meta property="og:image:alt" content="Fluxero — green hydrogen from captured energy" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fluxero.uk/" />
    <meta property="og:locale" content="en" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fluxero — Green Hydrogen from Captured Energy" />
    <meta name="twitter:description" content="We capture wasted wind, solar & hydro energy and turn it into green hydrogen at the source — before the grid can reject it." />
    <meta name="twitter:image" content="https://fluxero.uk/logo.png" />

    <!-- Structured data for search + AI engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Fluxero",
      "url": "https://fluxero.uk/",
      "logo": "https://fluxero.uk/logo.png",
      "description": "Fluxero converts curtailed renewable energy into green hydrogen at the source with Small Modular Hydrogen Plants, deployable worldwide.",
      "slogan": "Captured energy. Green hydrogen.",
      "knowsAbout": ["green hydrogen", "renewable energy curtailment", "electrolysis", "Small Modular Hydrogen Plants", "energy digital twins"]
    }
    </script>

    <!-- SPA fallback decode (must run before React mounts). Pairs with public/404.html. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&family=IBM+Plex+Sans+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif:   ['"DM Serif Display"', 'serif'],
              display: ['"IBM Plex Sans Condensed"', 'sans-serif'],
              body:    ['"IBM Plex Sans"', 'sans-serif'],
              mono:    ['"IBM Plex Mono"', 'monospace'],
            },
            colors: {
              amber: {
                DEFAULT: '#00D68F',
                dark:    '#00A86B',
                glow:    'rgba(0,214,143,0.12)',
                dim:     'rgba(0,214,143,0.06)',
              },
              ink: {
                DEFAULT: '#070608',
                1: '#0D0C0F',
                2: '#131116',
                3: '#1A1820',
                4: '#222030',
              },
              steel: '#64748B',
              mist:  '#A8A3B3',
              cream: '#F0EBE0',
            },
          }
        }
      }
    </script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --amber: #00D68F;
        --amber-glow: rgba(0,214,143,0.12);
        --ink: #070608;
        --ink1: #0D0C0F;
        --ink2: #131116;
        --ink3: #1A1820;
        --cream: #F0EBE0;
        --mist: #A8A3B3;
        --steel: #64748B;
      }

      html { font-size: 18px; scroll-behavior: smooth; }

      body {
        background: var(--ink);
        color: var(--cream);
        font-family: 'IBM Plex Sans', sans-serif;
        font-weight: 300;
        overflow-x: hidden;
        cursor: auto;
      }

      /* Subtle noise overlay — very light */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 1000;
        opacity: 0.08;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-track { background: var(--ink); }
      ::-webkit-scrollbar-thumb { background: var(--ink2); }
      ::-webkit-scrollbar-thumb:hover { background: var(--amber); }

      ::selection { background: rgba(0,214,143,0.25); color: var(--cream); }

      /* Gradient text */
      .text-green-gradient, .text-amber-gradient {
        background: linear-gradient(135deg, #00D68F 0%, #00B4CC 60%, #0077B6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Glow effects */
      .amber-glow, .primary-glow { box-shadow: 0 0 40px rgba(0,214,143,0.12), 0 0 80px rgba(0,214,143,0.04); }
      .amber-glow-text { text-shadow: 0 0 40px rgba(0,214,143,0.35); }

      .mag-btn { transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1); }

      .h-scroll { overflow-x: auto; scrollbar-width: none; }
      .h-scroll::-webkit-scrollbar { display: none; }

      .fade-up {
        opacity: 0;
        transform: translateY(32px);
        transition: opacity 0.7s ease, transform 0.7s ease;
      }
      .fade-up.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .font-serif { font-family: "DM Serif Display", serif; }

      input[type=range] { accent-color: var(--amber); }
      select option { background: var(--ink1); }
      input:focus, select:focus, textarea:focus { outline: none; }

      .counter { font-variant-numeric: tabular-nums; }

      .clip-diagonal {
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 60px), 0 100%);
      }

      .hr-amber { border: none; height: 1px; background: linear-gradient(90deg, transparent, var(--amber), transparent); }

      /* IBM Carbon-inspired spacing — base 8px unit */
      section { padding-top: 6rem !important; padding-bottom: 6rem !important; }
      @media (max-width: 640px) { section { padding-top: 4rem !important; padding-bottom: 4rem !important; } }

      /* Color utility classes — green theme */
      .text-green  { color: #00D68F !important; }
      .text-amber  { color: #00D68F !important; }
      .bg-green    { background-color: #00D68F !important; }
      .bg-amber    { background-color: #00D68F !important; }
      .border-green { border-color: #00D68F !important; }
      .border-amber { border-color: #00D68F !important; }
      .text-green-gradient, .text-amber-gradient {
        background: linear-gradient(135deg, #00D68F 0%, #00B4CC 60%, #0077B6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .bg-green-dark { background-color: #00A86B !important; }
      .bg-amber-dark { background-color: #00A86B !important; }
      .text-mist   { color: #A8A3B3; }
      .text-steel  { color: #64748B; }
      .text-cream  { color: #F0EBE0; }
      .text-ink    { color: #070608 !important; }
      .bg-ink-2    { background-color: #131116; }
      .bg-ink-3    { background-color: #1A1820; }
      .border-amber\/20 { border-color: rgba(0,214,143,0.2) !important; }
      .border-amber\/30 { border-color: rgba(0,214,143,0.3) !important; }
      .border-white\/5  { border-color: rgba(255,255,255,0.05); }
      .border-white\/6  { border-color: rgba(255,255,255,0.06); }
      .border-white\/7  { border-color: rgba(255,255,255,0.07); }
      .border-white\/10 { border-color: rgba(255,255,255,0.10); }

      /* Mobile-specific fixes */
      @media (max-width: 640px) {
        body { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        .hero-content { padding-top: 6rem !important; }
        .code-block { font-size: 11px !important; }
        .calc-panel { border-left: none !important; }
      }

      @media (max-width: 768px) {
        button, a { min-height: 44px; }
        .roadmap-card { width: 240px !important; }
      }

      .partner-logo {
        display: block;
        height: auto;
        max-width: 100%;
        object-fit: contain;
      }

      @media (max-width: 720px) {
        .h2-calc-shell {
          flex-direction: column !important;
          height: auto !important;
          min-height: 100% !important;
          overflow: visible !important;
        }
        .h2-calc-sidebar {
          position: relative !important;
          top: auto !important;
          width: 100% !important;
          height: auto !important;
          border-right: none !important;
          border-bottom: 1px solid rgba(255,255,255,0.08) !important;
          padding: 20px !important;
        }
        .h2-calc-main {
          width: 100% !important;
          max-width: none !important;
          overflow-y: visible !important;
          padding: 24px 18px !important;
        }
        .h2-grid-2,
        .h2-grid-3,
        .h2-grid-4,
        .h2-grid-5 {
          grid-template-columns: 1fr !important;
        }
        .energy-explainer-grid {
          grid-template-columns: 1fr !important;
          gap: 28px !important;
        }
        .energy-scene {
          height: 340px !important;
        }
        input,
        select,
        textarea {
          font-size: 16px !important;
        }
      }

      @supports (padding-bottom: env(safe-area-inset-bottom)) {
        .fixed-bottom { padding-bottom: env(safe-area-inset-bottom); }
      }

    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
